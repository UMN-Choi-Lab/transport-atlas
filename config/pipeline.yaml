seed: 1337

# Scheduled-update cadence. `cadence_human` is shown on the site front page;
# `cadence_cron` is the crontab spec the scheduled job runs on. The scheduled
# job defaults to a FULL OpenAlex re-pull (no date filter) because OpenAlex's
# publication_date is unreliable (placeholder Jan-1 dates, preprint dates) and
# the created/updated-date filters are premium-gated — so a publication-date
# window silently misses re-associated / preprint-promoted papers. `lookback_days`
# only applies to the optional --incremental fast-probe mode.
update:
  cadence_human: "weekly"
  cadence_cron: "0 11 * * 1"        # Mondays 11:00 UTC ≈ 06:00 America/Chicago (CST)
  lookback_days: 90                 # only used by 01_ingest.py --incremental (fast, lossy)

analytics:
  # GoatCounter site code (subdomain of goatcounter.com). Set to null to disable
  # tracking + the per-page view-count badge. The public count badge also
  # requires "Allow public access to the visitor count" in GoatCounter settings.
  goatcounter_code: transport-atlas

openalex:
  base_url: "https://api.openalex.org"
  per_page: 200
  rate_limit_per_sec: 8
  mailto_from_env: CROSSREF_EMAIL      # uses same email as Crossref polite pool

elsevier:
  base_url: "https://api.elsevier.com"
  rate_limit_per_sec: 2
  timeout_sec: 60
  max_retries: 5
  min_year: 2000                        # skip pre-2000 full text for v1

ieee:
  base_url: "https://ieeexploreapi.ieee.org/api/v1/search/articles"
  rate_limit_per_sec: 5
  max_records_per_call: 200
  max_records_per_venue: 10000

dedupe:
  fuzzy_title_threshold: 95
  min_surname_overlap: 1

graph:
  min_papers_per_author: 2
  min_coauthor_edge_weight: 1
  fa2_iterations: 500
  fa2_scaling_ratio: 2.0
  leiden_resolution: 1.0
  betweenness_k: 1000           # Brandes pivot sampling (faster on >20k-node graphs)
  ranking_top_k: 30               # rows per metric in author_rankings.json (mirrors Sun & Rahwan 2017)

render:
  top_hubs_count: 100
  explorer_columns:
    - title
    - authors_short
    - venue_short
    - year
    - cited_by_count
    - doi

